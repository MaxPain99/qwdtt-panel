<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qWDTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0b1220;--panel:rgba(22,32,52,.8);--line:rgba(148,163,184,.14);
  --text:#e8eef7;--muted:#8b9bb4;--acc:#2dd4bf;--acc-dim:rgba(45,212,191,.14);--bad:#fb7185;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font:16px/1.45 "DM Sans",system-ui,sans-serif;color:var(--text);
  background:
    radial-gradient(700px 380px at 15% 0%, rgba(45,212,191,.2), transparent 55%),
    radial-gradient(560px 320px at 100% 20%, rgba(56,189,248,.12), transparent 50%),
    linear-gradient(180deg,#0b1220,#111a2e);
  padding:24px;
}
form{
  width:min(400px,100%);padding:36px 32px;border-radius:24px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);
  box-shadow:0 30px 80px rgba(0,0,0,.35);
}
.mark{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--acc-dim)}
h1{margin:0;font:800 1.6rem/1.1 Syne,sans-serif;letter-spacing:-.03em;text-align:center}
p{margin:10px 0 26px;color:var(--muted);font-size:.92rem;text-align:center}
label{display:block;margin:0 0 7px;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
input{
  width:100%;height:48px;margin:0 0 14px;padding:0 14px;border-radius:14px;
  border:1px solid var(--line);background:rgba(8,12,22,.55);color:var(--text);outline:none;
}
input:focus{border-color:rgba(45,212,191,.55);box-shadow:0 0 0 3px var(--acc-dim)}
button{
  margin-top:8px;width:100%;height:48px;border:0;border-radius:14px;cursor:pointer;
  font-weight:700;color:#042f2e;background:linear-gradient(135deg,var(--acc),#14b8a6);
  box-shadow:0 12px 28px rgba(45,212,191,.22);
}
button:hover{filter:brightness(1.05)}
.err{color:var(--bad);min-height:1.2em;margin-top:12px;font-size:.9rem;text-align:center}
</style>
</head>
<body>
<form method="post" action="/login">
<div class="mark"><span class="dot" aria-hidden="true"></span></div>
<h1>qWDTT</h1>
<p>Панель управления qWDTT / CSQTT</p>
<label>Логин</label>
<input name="user" autocomplete="username" required>
<label>Пароль</label>
<input name="pass" type="password" autocomplete="current-password" required>
<div class="err" id="e"></div>
<button type="submit">Войти</button>
</form>
<script>
if (location.search.indexOf('bad')>=0) document.getElementById('e').textContent='Неверный логин или пароль';
</script>
</body>
</html>
