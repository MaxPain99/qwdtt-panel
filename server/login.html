<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qWDTT</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--primary:#0077ff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;align-items:center;justify-content:center}
form{background:var(--surface);padding:36px 32px;border-radius:20px;width:min(400px,92vw);border:1px solid var(--border);box-shadow:0 20px 40px rgba(15,23,42,.06)}
h1{margin:0 0 8px;font-size:1.4rem;text-align:center}
p{margin:0 0 22px;color:var(--muted);font-size:.9rem;text-align:center}
label{display:block;margin:10px 0 6px;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input{width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);outline:none}
input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(0,119,255,.12)}
button{margin-top:18px;width:100%;height:48px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 8px 16px rgba(0,119,255,.25)}
button:hover{filter:brightness(.95)}
.err{color:var(--bad);min-height:1.2em;margin-top:12px;font-size:.9rem;text-align:center}
</style>
</head>
<body>
<form method="post" action="/login">
<h1>Вход</h1>
<p>Панель qWDTT / CSQTT</p>
<label>Логин</label>
<input name="user" autocomplete="username" required>
<label>Пароль</label>
<input name="pass" type="password" autocomplete="current-password" required>
<div class="err" id="e"></div>
<button type="submit">Войти</button>
</form>
<script>
if (location.search.indexOf('bad')>=0) document.getElementById('e').textContent='Неверный логин или пароль';
</script>
</body>
</html>
